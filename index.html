<!DOCTYPE html>
<html>
<head>
    <title>My Login Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            padding: 30px;
            width: 300px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: black;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Login</h2>

        <input
            type="text"
            id="username"
            placeholder="Enter ID"
        >

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
        >

        <button onclick="login()">Login</button>

        <p id="message"></p>

    </div>

    <script>
        function login() {

            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;

            // YOUR LOGIN DETAILS
            if (username === "Dhakshu" && password === "0224") {

                window.location.href = "home.html";

            } else {

                document.getElementById("message").innerHTML =
                    "Wrong ID or Password";

            }
        }
    </script>

</body>
</html>
